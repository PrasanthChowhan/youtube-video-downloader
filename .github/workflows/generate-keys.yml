name: Generate Signing Keys

on:
  workflow_dispatch:

jobs:
  generate-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Generate Signing Keys
        run: |
          npx tauri signer generate --ci

      - name: Display Keys
        run: |
          echo "=============================================="
          echo "Copy the PRIVATE KEY and PUBLIC KEY above"
          echo "and save them to your GitHub Secrets!"
          echo "=============================================="
